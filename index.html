<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Marvin 旗下应用的隐私政策索引">
<meta name="theme-color" content="#ffffff">
<title>Privacy Policy - Index</title>
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f6f7f9;
    --text:#1c1f23;
    --text-soft:#5a6169;
    --line:#e4e7eb;
    --accent:#1f6feb;
    --accent-soft:#eef4ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a;
      --bg-soft:#1c2024;
      --text:#e8eaed;
      --text-soft:#a3abb4;
      --line:#2c3238;
      --accent:#6aa8ff;
      --accent-soft:#1b2733;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:64px 22px 90px;}
  h1{font-size:24px;margin:0 0 8px;letter-spacing:-.3px;}
  .sub{color:var(--text-soft);font-size:15px;margin:0 0 36px;}
  ul.apps{list-style:none;padding:0;margin:0;}
  ul.apps li{
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    margin:14px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .app{font-weight:600;}
  .app small{display:block;font-weight:400;color:var(--text-soft);font-size:13px;margin-top:2px;}
  .links{display:flex;gap:8px;}
  .links a{
    text-decoration:none;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:999px;
    padding:4px 14px;
    font-size:13.5px;
    white-space:nowrap;
  }
  .links a:hover{background:var(--accent-soft);}
  footer{margin-top:48px;border-top:1px solid var(--line);padding-top:18px;color:var(--text-soft);font-size:13.5px;}
  a.mail{color:var(--text-soft);}
</style>
</head>
<body>
<div class="wrap">
  <h1>隐私政策 · Privacy Policy</h1>
  <p class="sub">以下是我们提供各应用的隐私政策页面。顶层不再承载具体应用的政策，请从下方列表进入对应应用。</p>

  <ul class="apps">
    <li>
      <div class="app">Line Go（一线牵）<small>微信小游戏 · Android</small></div>
      <div class="links">
        <a href="./linego/" hreflang="zh-CN">简体中文</a>
        <a href="./linego/en.html" hreflang="en">English</a>
      </div>
    </li>
  </ul>

  <footer>
    <p>如有任何隐私相关问题，请联系：<a class="mail" href="mailto:wuyou517@gmail.com">wuyou517@gmail.com</a></p>
  </footer>
</div>
</body>
</html>
